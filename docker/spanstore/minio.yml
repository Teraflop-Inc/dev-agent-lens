# LOCAL DEV ONLY. Default credentials, loopback-bound. Never deploy this file.
# MinIO — S3-compatible object store. The common self-hosted choice.
#   docker compose -f docker/spanstore/minio.yml up -d
#   dal store use 's3://dal/spans?endpoint=127.0.0.1:9100&tls=0'
name: dal-minio
services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: dal-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${DAL_MINIO_USER:-dalminio}
      MINIO_ROOT_PASSWORD: ${DAL_MINIO_PASSWORD:-dalminio123}
    ports:
      - "127.0.0.1:${DAL_MINIO_PORT:-9100}:9000"
      - "127.0.0.1:${DAL_MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  minio_data:
