# Private receiver first. See STORE.md before deploying or attaching producers.
# The application name can be overridden with --app.
app = "dal-store"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "60s"

[build]
  dockerfile = "../deploy/Dockerfile"

[deploy]
  # No old/new writer overlap during a deploy. Brief downtime is intentional.
  strategy = "immediate"

[env]
  AWS_REGION = "auto"
  DAL_CONFIG_PATH = "/data/dal"
  DAL_SPAN_LAYOUT = "raw"
  DAL_DUCKDB_MEMORY = "1GB"
  DAL_DUCKDB_TMP = "/data/duckdb-tmp"
  TYPED_REBUILD = "0"

[processes]
  receiver = "dal otlp-receive --host 0.0.0.0 --port 4318"

[[mounts]]
  source = "dal_data"
  destination = "/data"
  processes = ["receiver"]

# Allocate ONLY a private Flycast IPv6 address. Never allocate public IPs.
# Flycast forwards to the receiver's IPv4 listener; .internal direct IPv6
# connections are not supported by the current receiver.
[http_service]
  internal_port = 4318
  force_https = false
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["receiver"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  processes = ["receiver"]
  cpu_kind = "shared"
  cpus = 1
  memory = "2gb"
