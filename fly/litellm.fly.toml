# sf-litellm — patched LiteLLM proxy (aowen14/litellm-oauth-fix) on Fly,
# fronting Anthropic for Solutions-Fabric workspace runs (ENG2-1194).
#
# Inbound is **tailnet-only** (ENG2-1234). No `[http_service]` block, no
# allocated public IPs — the proxy is only reachable via:
#   - `sf-litellm.internal:4000` from another Fly app in the teraflop org
#   - `http://sf-tailscale-router:4000/` from a team member on the tailnet
# Outbound (to Anthropic etc.) is unaffected; that uses the egress NAT.
#
# Auth model retained as defense-in-depth even though network exposure
# is gated:
#   - Probe / non-OAuth requests must send `Authorization: Bearer <master_key>`
#     (LITELLM_MASTER_KEY in Fly secrets) or get 401.
#   - Claude Code OAuth requests send `Authorization: Bearer sk-ant-oat...`;
#     the fork's user_api_key_auth early-returns proxy_admin for OAuth bearers
#     before master_key check, so per-user Anthropic billing is preserved.
#   - SDK callers (non-OAuth) authenticate with the master key.
#
# Deploy:
#   cd dev-agent-lens
#   flyctl apps create sf-litellm --org teraflop
#   flyctl secrets set LITELLM_MASTER_KEY=$(openssl rand -hex 32) --app sf-litellm
#   flyctl deploy --app sf-litellm --config fly/litellm.fly.toml
#
# OTLP exports to sf-phoenix.internal:4317 over the Fly private mesh.

app = "sf-litellm"
primary_region = "iad"

[build]
  image = "aowen14/litellm-oauth-fix:latest"

[env]
  # Phoenix OTLP target — internal-only, no public listener on sf-phoenix:4317.
  # gRPC here is deliberate and verified (ENG2-1494): the arize_phoenix callback
  # resolves a bare `:4317` endpoint to the otlp_grpc exporter itself. Do NOT
  # append `/v1/traces` to a :4317 endpoint — that flips the resolver to HTTP
  # and POSTs at a gRPC listener, which is the real failure mode behind the old
  # "gRPC silently drops spans" myth. See
  # docs/design/observability-backend-strategy.md §1.
  OTEL_EXPORTER_OTLP_ENDPOINT = "http://sf-phoenix.internal:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL = "grpc"
  PHOENIX_COLLECTOR_ENDPOINT  = "http://sf-phoenix.internal:4317"

  # Project name in Phoenix UI — surface so spans from this proxy are filterable.
  OTEL_SERVICE_NAME = "sf-workspaces"
  OTEL_RESOURCE_ATTRIBUTES = "service.name=sf-workspaces,openinference.project.name=sf-workspaces"

  # Don't drop callback failures silently; LiteLLM's default-quiet on OTel
  # errors hid a misrouted endpoint for half a day in dev-agent-lens.
  LITELLM_LOG = "INFO"

  # --- gRPC 4 MiB ceiling containment (ENG2-1510 follow-up, 2026-08-12) ---
  #
  # Symptom: HITL rollouts were NOT being captured at all, while host sessions
  # captured fine. Proven live: the in-VM shim POSTed 3x 200 OK to this proxy,
  # and 3s later sf-litellm logged
  #     Transient error StatusCode.RESOURCE_EXHAUSTED ... retrying in 1s/2s/4s/8s/16s/32s
  # and the spans never landed. Last sandbox-tagged span in the whole DB was
  # 17:08 that day. gRPC caps a message at 4 MiB (4096 kB) AFTER decompression.
  #
  # Cause, measured (uncompressed, `length(attributes::text)`):
  #     raw_gen_ai_request   avg 1519 kB   max 3419 kB   <- the whale
  #     litellm_request      avg   11 kB   max  111 kB   <- what DAL reads
  # Same trace, side by side: whale 3419 kB vs its own litellm_request 61 kB.
  # The whale is a ~55x duplicate of the request (llm.anthropic.messages
  # 2968 kB + .tools 440 kB, both FLAT STRING attributes). Rollouts carry the
  # full CLAUDE.md + skills, so their batches blow the cap first — which is
  # exactly why rollouts died and host sessions lived.
  #
  # ENG2-1461 tried to kill the whale via callback_settings.message_logging and
  # blinded content for 9 days (see litellm_config_fly.yaml). The config note
  # there concludes there is "no config-only lever" — true of LITELLM settings,
  # but the lever exists one layer down, in the OTel SDK, and shrinks the whale
  # WITHOUT touching content:
  #
  #   * ATTRIBUTE VALUE LIMIT 256 kB — truncates llm.anthropic.messages/.tools
  #     (MB-scale) while every real content attribute stays whole: largest
  #     observed is 111 kB, so this keeps 2.3x headroom. DAL never reads
  #     llm.anthropic.* (0 refs); it reads litellm_request input/output.
  #     Post-truncation the whale is ~525 kB (256 + 256 + 11).
  #   * BATCH 4 — 4 x ~525 kB ~= 2.1 MB, ~2x under the 4 MiB cap. Required:
  #     the default batch of 512 would still overflow at any span size.
  #
  # Do NOT "fix" this by changing the endpoint/protocol instead. Switching
  # OTEL_EXPORTER_OTLP_ENDPOINT to :6006/v1/traces http/protobuf was tried on
  # 2026-08-12 and stopped ingestion outright for ~9 minutes. Endpoints stay
  # gRPC :4317 (see the block above).
  OTEL_SPAN_ATTRIBUTE_VALUE_LENGTH_LIMIT = "262144"
  OTEL_BSP_MAX_EXPORT_BATCH_SIZE = "4"

# Ship the config into the image at deploy time. Fly's [[files]] copies the
# local file into the running container — no custom Dockerfile needed, no
# volume to keep in sync. The image's entrypoint reads /app/config.yaml
# (overridden via [processes.app] below if needed).
[[files]]
  guest_path = "/app/config.yaml"
  local_path = "fly/litellm_config_fly.yaml"

# Thinking-summaries hook (ENG2-1487): forces display="summarized" on adaptive
# requests so reasoning text lands in Phoenix. Rollback = drop the callback
# entry in litellm_config_fly.yaml and redeploy.
[[files]]
  guest_path = "/app/thinking_display_hook.py"
  local_path = "thinking_display_hook.py"

[processes]
  # Mirrors the docker-compose command for litellm-proxy-phoenix.
  # --host :: makes uvicorn bind dual-stack instead of IPv4-only; without
  # this, direct hits to sf-litellm.internal:4000 from another Fly app or
  # via the Tailscale subnet router (ENG2-1234) get ECONNREFUSED, because
  # Fly's private mesh is IPv6-only. Same fix as PHOENIX_HOST=:: in phoenix.fly.toml.
  app = "--config /app/config.yaml --host :: --port 4000 --num_workers 1"

# Internal-only service declaration. No `[[services.ports]]`, so the port
# only listens on the Fly 6PN mesh — public ingress is impossible without
# allocated IPs (which we explicitly released as part of ENG2-1234).
[[services]]
  internal_port = 4000
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
