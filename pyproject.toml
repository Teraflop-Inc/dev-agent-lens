[project]
name = "dev_agent_lens"
version = "0.1.0"
description = "Unified trace analysis toolkit for Claude Code observability"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Teraflop Inc"}
]
keywords = ["observability", "tracing", "claude", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "arize>=7.0.3",
    "arize-phoenix>=4.0.0",
    "click>=8.0.0",
    "duckdb>=1.4.3,<1.6",  # conservative: recipes tested on 1.4.3; <1.6 avoids an untested bump (uv.lock pins exact) (ENG2-1447)
    "openai>=2.13.0",
    "oxenai>=0.42.0",
    "pandas>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "pyarrow>=22.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]
# `dal push-atif` only. Kept optional so the core CLI has no OTel dependency.
# harbor-atif2otel needs 3.12+ while this package supports 3.11, so it is
# marker-gated; on 3.11 the import fails with an actionable message instead of
# making the whole extra unresolvable.
otlp = [
    "harbor-atif2otel>=0.1.0; python_version >= '3.12'",
    "opentelemetry-proto>=1.20.0",
]

[project.scripts]
dal = "dev_agent_lens.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dev_agent_lens"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
